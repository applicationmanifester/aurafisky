<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sun rays -->
  <g fill="#ff9f1c">
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-60, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-40, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-20, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(0, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(20, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(40, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(60, 50, 36)" />
  </g>

  <!-- Sun -->
  <circle cx="50" cy="36" r="18" fill="#e84c4c" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Wind dashes left -->
  <line x1="20" y1="38" x2="26" y2="38" stroke="#593c7d" stroke-width="3" stroke-linecap="round" />
  <line x1="16" y1="44" x2="24" y2="44" stroke="#593c7d" stroke-width="3" stroke-linecap="round" />

  <!-- Wind dash top-right -->
  <line x1="68" y1="32" x2="76" y2="32" stroke="#593c7d" stroke-width="3" stroke-linecap="round" />

  <!-- Pink Cloud -->
  <path d="M 30,52 h 20 a 7,7 0 0,0 7,-7 a 8,8 0 0,0 -6,-7.7 a 11,11 0 0,0 -19,-2.3 a 8,8 0 0,0 -9,8 a 7,7 0 0,0 7,9 z" 
        fill="#c23365" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Wind swirls right -->
  <path d="M 64,40 h 11 C 78,40 80,38 80,36 C 80,34 78,32 76,32 C 74,32 73,34 74,36" 
        stroke="#593c7d" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 70,48 h 9 C 82,48 84,50 84,52 C 84,54 82,56 80,56 C 78,56 77,54 78,52" 
        stroke="#593c7d" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Purple Cloud -->
  <path d="M 42,62 h 24 a 8,8 0 0,0 8,-8 a 9,9 0 0,0 -7,-8.7 a 13,13 0 0,0 -22,-2.6 a 9,9 0 0,0 -10,9.3 a 8,8 0 0,0 7,10 z" 
        fill="#6a3c91" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Wind lines bottom -->
  <line x1="33" y1="70" x2="37" y2="70" stroke="#593c7d" stroke-width="3" stroke-linecap="round" />
  <path d="M 40,70 h 15 C 57,70 59,72 59,74 C 59,76 57,78 55,78 C 53,78 52,76 53,74" 
        stroke="#593c7d" stroke-width="3" stroke-linecap="round" fill="none" />
  <line x1="62" y1="70" x2="67" y2="70" stroke="#593c7d" stroke-width="3" stroke-linecap="round" />
</svg>
