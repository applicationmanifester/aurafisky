<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" opacity="0.2"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity="0.5"/>

  <!-- Aurora waves -->
  <path d="M 14 58 Q 28 35 42 52 Q 56 32 70 48 Q 82 36 90 52" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 12 64 Q 24 44 38 60 Q 52 40 66 56 Q 78 44 92 58" fill="none" stroke="url(#aurora)" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- Sun -->
  <circle cx="50" cy="36" r="12" fill="url(#sunGrad)" opacity="0.95" filter="url(#glow)"/>
  <!-- Rays -->
  <g stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <line x1="50" y1="18" x2="50" y2="12"/>
    <line x1="50" y1="54" x2="50" y2="60"/>
    <line x1="32" y1="36" x2="26" y2="36"/>
    <line x1="68" y1="36" x2="74" y2="36"/>
    <line x1="37" y1="23" x2="33" y2="19"/>
    <line x1="63" y1="23" x2="67" y2="19"/>
    <line x1="37" y1="49" x2="33" y2="53"/>
    <line x1="63" y1="49" x2="67" y2="53"/>
  </g>

  <!-- Stars -->
  <circle cx="22" cy="18" r="2" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="78" cy="20" r="1.5" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="20" cy="78" r="1.5" fill="#c7d2fe" opacity="0.4"/>
  <circle cx="80" cy="76" r="1.8" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="72" cy="88" r="1.2" fill="#c7d2fe" opacity="0.35"/>
</svg>
