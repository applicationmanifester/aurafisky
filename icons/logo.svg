<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#e84c4c"/>
    </linearGradient>
    <linearGradient id="sunRayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="cloudPinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e84c88"/>
      <stop offset="100%" stop-color="#c23365"/>
    </linearGradient>
    <linearGradient id="cloudPurpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6a3c91"/>
    </linearGradient>
    <linearGradient id="windGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#593c7d"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cloudShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sun rays (outer glow) -->
  <g fill="url(#sunRayGrad)" opacity="0.9">
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-60, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-35, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(-10, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(15, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(40, 50, 36)" />
    <polygon points="50,11 46.5,18 53.5,18" transform="rotate(65, 50, 36)" />
  </g>

  <!-- Sun body with glow -->
  <circle cx="50" cy="36" r="18" fill="url(#sunGrad)" filter="url(#sunGlow)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Wind dashes (left side) -->
  <line x1="20" y1="38" x2="26" y2="38" stroke="url(#windGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="16" y1="44" x2="24" y2="44" stroke="url(#windGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Wind dash (top-right) -->
  <line x1="68" y1="32" x2="76" y2="32" stroke="url(#windGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Pink Cloud with shadow -->
  <g filter="url(#cloudShadow)">
    <path d="M 28,52 h 22 a 7,7 0 0,0 7,-7 a 8,8 0 0,0 -6,-7.7 a 11,11 0 0,0 -19,-2.3 a 8,8 0 0,0 -9,8 a 7,7 0 0,0 5,9 z" 
          fill="url(#cloudPinkGrad)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Wind swirls (right side) -->
  <path d="M 62,40 h 11 C 76,40 78,38 78,36 C 78,34 76,32 74,32 C 72,32 71,34 72,36" 
        stroke="url(#windGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 67,48 h 11 C 81,48 83,50 83,52 C 83,54 81,56 79,56 C 77,56 76,54 77,52" 
        stroke="url(#windGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Purple Cloud with shadow -->
  <g filter="url(#cloudShadow)">
    <path d="M 40,64 h 24 a 8,8 0 0,0 8,-8 a 9,9 0 0,0 -7,-8.7 a 13,13 0 0,0 -22,-2.6 a 9,9 0 0,0 -10,9.3 a 8,8 0 0,0 5,10 z" 
          fill="url(#cloudPurpleGrad)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Wind lines (bottom) -->
  <line x1="33" y1="72" x2="37" y2="72" stroke="url(#windGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 40,72 h 15 C 57,72 59,74 59,76 C 59,78 57,80 55,80 C 53,80 52,78 53,76" 
        stroke="url(#windGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <line x1="62" y1="72" x2="67" y2="72" stroke="url(#windGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>