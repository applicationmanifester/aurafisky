<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="52" fill="url(#skyGrad)" opacity="0.15"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity="0.4"/>

  <!-- Aurora waves -->
  <path d="M 20 72 Q 35 42 50 62 Q 65 42 80 58 Q 90 48 100 62" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M 16 78 Q 30 52 45 70 Q 60 48 75 66 Q 88 54 104 68" fill="none" stroke="url(#aurora)" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
  <path d="M 12 84 Q 28 62 40 78 Q 55 58 70 74 Q 85 62 100 76" fill="none" stroke="url(#aurora)" stroke-width="1.5" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>

  <!-- Sun circle -->
  <circle cx="60" cy="48" r="14" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="28" x2="60" y2="22"/>
    <line x1="60" y1="68" x2="60" y2="74"/>
    <line x1="40" y1="48" x2="34" y2="48"/>
    <line x1="80" y1="48" x2="86" y2="48"/>
    <line x1="46" y1="34" x2="42" y2="30"/>
    <line x1="74" y1="34" x2="78" y2="30"/>
    <line x1="46" y1="62" x2="42" y2="66"/>
    <line x1="74" y1="62" x2="78" y2="66"/>
  </g>

  <!-- Small stars -->
  <circle cx="28" cy="28" r="1.5" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="88" cy="30" r="1" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="34" cy="90" r="1" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="82" cy="88" r="1.2" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="95" cy="50" r="0.8" fill="#c7d2fe" opacity="0.4"/>

  <!-- Text -->
  <text x="130" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="1" fill="url(#aurora)" filter="url(#shadow)">Aurafisky</text>
  <text x="130" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#94a3b8">WEATHER · RADAR · FORECAST</text>
</svg>
