<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="glowSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowAura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark (Centered at X=60, Y=60) -->
  <g transform="translate(10, 10)">
    <!-- Background circular aura glow -->
    <circle cx="50" cy="50" r="40" fill="#6366f1" opacity="0.12" filter="url(#auraGlow)" />
    
    <!-- Base Sphere (Sky/Earth) -->
    <circle cx="46" cy="54" r="22" fill="url(#glowSky)" opacity="0.85" />
    
    <!-- Aura Ribbon (Sleek loop) -->
    <path d="M 22 68 C 12 50, 24 24, 50 24 C 76 24, 88 50, 78 68 C 68 86, 32 86, 22 68 Z" 
          fill="none" stroke="url(#glowAura)" stroke-width="6" stroke-linecap="round" filter="url(#auraGlow)" />

    <!-- The Sun (Warm intersection) -->
    <circle cx="62" cy="40" r="14" fill="url(#glowSun)" filter="url(#auraGlow)" />
  </g>

  <!-- Typography -->
  <text x="135" y="65" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)" filter="url(#shadow)">Aurafisky</text>
  <text x="136" y="88" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#64748b">WEATHER • RADAR • FORECAST</text>
</svg>
